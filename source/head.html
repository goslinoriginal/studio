<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F1EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F1EA; --surface:#FFFDF9; --surface-2:#F1EAE1; --ink:#2A2320; --muted:#7A6E66; --line:#E6DCD1;
  --accent:#B4553A; --accent-ink:#fff; --accent-soft:#F6E1D7;
  --sage:#4F7F68; --sage-soft:#DCEBE2;
  --sky:#46699E; --sky-soft:#DFE7F4;
  --lilac:#7656A6; --lilac-soft:#ECE4F6;
  --butter:#9A6E0B; --butter-soft:#F7EBC6;
  --bad:#B23A3A; --bad-soft:#F7DEDA;
  --shadow:0 1px 2px rgba(42,35,32,.05),0 6px 20px rgba(42,35,32,.06);
  --display:"Fraunces",Georgia,serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1A1614; --surface:#231E1B; --surface-2:#2C2622; --ink:#F1E9E2; --muted:#A99D94; --line:#3A322D;
  --accent:#E58B6E; --accent-ink:#2A120A; --accent-soft:#3D2620;
  --sage:#8CC2A6; --sage-soft:#22342B; --sky:#8FB0E3; --sky-soft:#1F2A3B;
  --lilac:#B9A0E3; --lilac-soft:#2D2440; --butter:#E2B651; --butter-soft:#382D13;
  --bad:#EE8578; --bad-soft:#3D1F1C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;margin:0}

/* ---------- App frame: bottom tabs on phones, sidebar on laptops ---------- */
#app{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{padding:4px 16px 24px;max-width:1180px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:12px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
nav.tabs .brand{display:none}
nav.tabs button{position:relative}
.tab-badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;line-height:17px;font-weight:700}
@media (min-width:900px){.tab-badge{position:static;margin-left:auto}}
@media (min-width:900px){
  #app{padding-bottom:0;padding-left:232px}
  nav.tabs{top:0;right:auto;width:232px;border-top:0;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:20px 12px;background:var(--surface)}
  nav.tabs .brand{display:block;padding:4px 12px 18px}
  nav.tabs .brand b{font-family:var(--display);font-size:24px;font-weight:700;display:block}
  nav.tabs .brand span{font-size:12.5px;color:var(--muted)}
  nav.tabs button{flex-direction:row;gap:12px;font-size:14.5px;padding:10px 12px;justify-content:flex-start}
  nav.tabs button.on{background:var(--accent-soft)}
  .top{padding:20px 28px 12px}
  .top h1{font-size:30px}
  .main{padding:4px 28px 40px}
}

/* ---------- Building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.grid{display:grid;gap:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px 16px}
.stat small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat em{font-style:normal;font-size:12.5px;color:var(--muted)}
.section{margin-top:22px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px}
.section-h h2{font-size:19px}
.two{display:grid;gap:16px}
@media (min-width:1000px){.two{grid-template-columns:1.25fr 1fr;align-items:start}}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.list .row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;white-space:nowrap;text-align:right}
.row .amt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--accent-soft);color:var(--accent)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.p-accent{background:var(--accent-soft);color:var(--accent)} .p-sage{background:var(--sage-soft);color:var(--sage)}
.p-sky{background:var(--sky-soft);color:var(--sky)} .p-lilac{background:var(--lilac-soft);color:var(--lilac)}
.p-butter{background:var(--butter-soft);color:var(--butter)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{font-style:normal;opacity:.65;margin-left:4px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:12px;font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--ink)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:10px}
.btn.ghost{background:none;border-color:transparent}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.icon-btn svg{width:20px;height:20px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(180,85,58,.35);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}
@media (min-width:900px){.fab{bottom:28px;right:32px}}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:700px){.quick{grid-template-columns:repeat(6,1fr)}}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer}
.quick button span{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.quick svg{width:19px;height:19px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{border:0;background:none;outline:none;flex:1;padding:11px 0;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;cursor:pointer;border:0;background:none;padding:6px 4px}
.sync .dot{width:8px;height:8px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- Pipeline board (laptop) ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;min-height:120px}
.col h3{font-family:var(--body);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin:2px 4px 10px}
.col h3 i{font-style:normal;color:var(--muted);font-weight:600;margin-left:auto}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;display:block;width:100%;text-align:left}
.mini b{display:block;font-size:14px}
.mini span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

/* ---------- Sheets (bottom sheet on phone, dialog on laptop) ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(30,22,18,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.sheet-h h2{font-size:21px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sheet-b{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 22px 22px}
.sheet-f .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{opacity:0}}

/* ---------- Forms ---------- */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 2;min-width:0}
.f.half{grid-column:span 1}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;outline:none;font-size:16px;min-width:0}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f .hint{font-size:12px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}
.items .it{display:grid;grid-template-columns:1fr 64px 100px 32px;gap:6px;margin-bottom:6px;align-items:center}
.items input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:16px;width:100%;min-width:0}
.items .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px}

/* ---------- Detail views ---------- */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word;white-space:pre-wrap}
.note{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.note:first-child{border-top:0}
.note small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.note p{margin:0;white-space:pre-wrap}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sage);border-radius:99px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;box-shadow:var(--shadow);animation:up .2s}
.chart{width:100%;height:auto;max-height:230px;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- Invoice paper (screen preview + print) ---------- */
.paper{background:#fff;color:#2A2320;border-radius:12px;padding:22px;border:1px solid var(--line);font-size:13px}
.paper .ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}
.paper .ph h3{font-size:26px;font-family:var(--display);color:#B4553A}
.paper .biz{text-align:right;font-size:12px;color:#6b605a;white-space:pre-line}
.paper .biz b{color:#2A2320;font-size:14px}
.paper .meta{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.paper .meta div{font-size:12.5px;white-space:pre-line}
.paper .meta small{display:block;color:#8a7f78;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;margin-bottom:3px}
.paper table{width:100%;border-collapse:collapse}
.paper th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#8a7f78;border-bottom:1.5px solid #2A2320;padding:6px 4px}
.paper td{padding:8px 4px;border-bottom:1px solid #eee3d8;vertical-align:top}
.paper .r{text-align:right;white-space:nowrap}
.paper .tot{margin-left:auto;width:min(260px,100%);margin-top:12px}
.paper .tot div{display:flex;justify-content:space-between;padding:4px}
.paper .tot .big{font-weight:700;font-size:16px;border-top:1.5px solid #2A2320;margin-top:4px;padding-top:8px}
.paper .foot{margin-top:22px;font-size:12px;color:#6b605a;white-space:pre-line;border-top:1px solid #eee3d8;padding-top:12px}
#print{display:none}
@media print{
  body{background:#fff}
  #app,.overlay,.toast,nav,.fab{display:none!important}
  #print{display:block}
  #print .paper{border:0;padding:0;font-size:12.5px}
  @page{margin:16mm}
}

/* ---------- Welcome ---------- */
.welcome{max-width:460px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 20px 40px}
.welcome .logo{width:76px;height:76px;border-radius:22px;margin-bottom:18px}
.welcome h1{font-size:34px;margin-bottom:6px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.who button{padding:18px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;cursor:pointer}
.who button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
