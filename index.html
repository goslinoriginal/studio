<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F1EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F1EA; --surface:#FFFDF9; --surface-2:#F1EAE1; --ink:#2A2320; --muted:#7A6E66; --line:#E6DCD1;
  --accent:#B4553A; --accent-ink:#fff; --accent-soft:#F6E1D7;
  --sage:#4F7F68; --sage-soft:#DCEBE2;
  --sky:#46699E; --sky-soft:#DFE7F4;
  --lilac:#7656A6; --lilac-soft:#ECE4F6;
  --butter:#9A6E0B; --butter-soft:#F7EBC6;
  --bad:#B23A3A; --bad-soft:#F7DEDA;
  --shadow:0 1px 2px rgba(42,35,32,.05),0 6px 20px rgba(42,35,32,.06);
  --display:"Fraunces",Georgia,serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1A1614; --surface:#231E1B; --surface-2:#2C2622; --ink:#F1E9E2; --muted:#A99D94; --line:#3A322D;
  --accent:#E58B6E; --accent-ink:#2A120A; --accent-soft:#3D2620;
  --sage:#8CC2A6; --sage-soft:#22342B; --sky:#8FB0E3; --sky-soft:#1F2A3B;
  --lilac:#B9A0E3; --lilac-soft:#2D2440; --butter:#E2B651; --butter-soft:#382D13;
  --bad:#EE8578; --bad-soft:#3D1F1C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;margin:0}

/* ---------- App frame: bottom tabs on phones, sidebar on laptops ---------- */
#app{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{padding:4px 16px 24px;max-width:1180px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:12px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
nav.tabs .brand{display:none}
nav.tabs button{position:relative}
.tab-badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;line-height:17px;font-weight:700}
@media (min-width:900px){.tab-badge{position:static;margin-left:auto}}
@media (min-width:900px){
  #app{padding-bottom:0;padding-left:232px}
  nav.tabs{top:0;right:auto;width:232px;border-top:0;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:20px 12px;background:var(--surface)}
  nav.tabs .brand{display:block;padding:4px 12px 18px}
  nav.tabs .brand b{font-family:var(--display);font-size:24px;font-weight:700;display:block}
  nav.tabs .brand span{font-size:12.5px;color:var(--muted)}
  nav.tabs button{flex-direction:row;gap:12px;font-size:14.5px;padding:10px 12px;justify-content:flex-start}
  nav.tabs button.on{background:var(--accent-soft)}
  .top{padding:20px 28px 12px}
  .top h1{font-size:30px}
  .main{padding:4px 28px 40px}
}

/* ---------- Building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.grid{display:grid;gap:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px 16px}
.stat small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat em{font-style:normal;font-size:12.5px;color:var(--muted)}
.section{margin-top:22px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px}
.section-h h2{font-size:19px}
.two{display:grid;gap:16px}
@media (min-width:1000px){.two{grid-template-columns:1.25fr 1fr;align-items:start}}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.list .row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;white-space:nowrap;text-align:right}
.row .amt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--accent-soft);color:var(--accent)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.p-accent{background:var(--accent-soft);color:var(--accent)} .p-sage{background:var(--sage-soft);color:var(--sage)}
.p-sky{background:var(--sky-soft);color:var(--sky)} .p-lilac{background:var(--lilac-soft);color:var(--lilac)}
.p-butter{background:var(--butter-soft);color:var(--butter)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{font-style:normal;opacity:.65;margin-left:4px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:12px;font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--ink)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:10px}
.btn.ghost{background:none;border-color:transparent}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.icon-btn svg{width:20px;height:20px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(180,85,58,.35);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}
@media (min-width:900px){.fab{bottom:28px;right:32px}}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:700px){.quick{grid-template-columns:repeat(6,1fr)}}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer}
.quick button span{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.quick svg{width:19px;height:19px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{border:0;background:none;outline:none;flex:1;padding:11px 0;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;cursor:pointer;border:0;background:none;padding:6px 4px}
.sync .dot{width:8px;height:8px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- Pipeline board (laptop) ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;min-height:120px}
.col h3{font-family:var(--body);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin:2px 4px 10px}
.col h3 i{font-style:normal;color:var(--muted);font-weight:600;margin-left:auto}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;display:block;width:100%;text-align:left}
.mini b{display:block;font-size:14px}
.mini span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

/* ---------- Sheets (bottom sheet on phone, dialog on laptop) ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(30,22,18,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.sheet-h h2{font-size:21px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sheet-b{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 22px 22px}
.sheet-f .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{opacity:0}}

/* ---------- Forms ---------- */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 2;min-width:0}
.f.half{grid-column:span 1}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;outline:none;font-size:16px;min-width:0}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f .hint{font-size:12px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}
.items .it{display:grid;grid-template-columns:1fr 64px 100px 32px;gap:6px;margin-bottom:6px;align-items:center}
.items input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:16px;width:100%;min-width:0}
.items .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px}

/* ---------- Detail views ---------- */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word;white-space:pre-wrap}
.note{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.note:first-child{border-top:0}
.note small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.note p{margin:0;white-space:pre-wrap}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sage);border-radius:99px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;box-shadow:var(--shadow);animation:up .2s}
.chart{width:100%;height:auto;max-height:230px;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- Invoice paper (screen preview + print) ---------- */
.paper{background:#fff;color:#2A2320;border-radius:12px;padding:22px;border:1px solid var(--line);font-size:13px}
.paper .ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}
.paper .ph h3{font-size:26px;font-family:var(--display);color:#B4553A}
.paper .biz{text-align:right;font-size:12px;color:#6b605a;white-space:pre-line}
.paper .biz b{color:#2A2320;font-size:14px}
.paper .meta{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.paper .meta div{font-size:12.5px;white-space:pre-line}
.paper .meta small{display:block;color:#8a7f78;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;margin-bottom:3px}
.paper table{width:100%;border-collapse:collapse}
.paper th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#8a7f78;border-bottom:1.5px solid #2A2320;padding:6px 4px}
.paper td{padding:8px 4px;border-bottom:1px solid #eee3d8;vertical-align:top}
.paper .r{text-align:right;white-space:nowrap}
.paper .tot{margin-left:auto;width:min(260px,100%);margin-top:12px}
.paper .tot div{display:flex;justify-content:space-between;padding:4px}
.paper .tot .big{font-weight:700;font-size:16px;border-top:1.5px solid #2A2320;margin-top:4px;padding-top:8px}
.paper .foot{margin-top:22px;font-size:12px;color:#6b605a;white-space:pre-line;border-top:1px solid #eee3d8;padding-top:12px}
#print{display:none}
@media print{
  body{background:#fff}
  #app,.overlay,.toast,nav,.fab{display:none!important}
  #print{display:block}
  #print .paper{border:0;padding:0;font-size:12.5px}
  @page{margin:16mm}
}

/* ---------- Welcome ---------- */
.welcome{max-width:460px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 20px 40px}
.welcome .logo{width:76px;height:76px;border-radius:22px;margin-bottom:18px}
.welcome h1{font-size:34px;margin-bottom:6px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.who button{padding:18px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;cursor:pointer}
.who button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<script>
"use strict";
/* =====================================================================
   Studio — a shared business app for Mari & Damien.
   Everything is in this one file: data, sync, screens and pop-ups.
   ===================================================================== */

/* ---------- Small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^\d.\-]/g, "")); return isFinite(n) ? n : 0; };
const ymd = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
const today = () => ymd(new Date());
const addDays = (dateStr, n) => { const d = new Date(dateStr + "T12:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
const money = n => "R " + Number(n || 0).toLocaleString("en-ZA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const moneyShort = n => { n = Number(n || 0); return "R " + (Math.abs(n) >= 100000 ? (n / 1000).toFixed(0) + "k" : Math.round(n).toLocaleString("en-ZA")); };
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function niceDate(s, withYear) {
  if (!s) return "";
  const d = new Date(s + "T12:00:00"), t = today();
  const diff = daysBetween(t, s);
  if (!withYear) { if (diff === 0) return "Today"; if (diff === 1) return "Tomorrow"; if (diff === -1) return "Yesterday"; }
  return `${d.getDate()} ${MONTHS[d.getMonth()]}` + (withYear || d.getFullYear() !== new Date().getFullYear() ? ` ${d.getFullYear()}` : "");
}
function timeAgo(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago"; if (s < 604800) return Math.floor(s / 86400) + "d ago";
  return niceDate(ymd(ts));
}
const initials = s => (String(s || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("") || "?").toUpperCase();
function waLink(phone, text) {
  let d = String(phone || "").replace(/\D/g, "");
  if (d.startsWith("0")) d = "27" + d.slice(1);
  return "https://wa.me/" + d + (text ? "?text=" + encodeURIComponent(text) : "");
}
function toast(msg) {
  $$(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function download(name, text, type = "application/json") {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- Icons (inline SVG, stroke style) ---------- */
const ICON = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  leads: '<path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/>',
  clients: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.6c2.4.2 4 1.8 4.5 4.4"/>',
  money: '<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9v.01M18 15v.01"/>',

function upsert(coll, rec) {

/* Merge two copies of the data. For every record the newest edit wins;
   deleted records stay deleted unless someone edited them afterwards. */
function merge(a, b) {
  if (!b) return canon(a);
  const out = blank();
  out.deleted = { ...(a.deleted || {}) };
  for (const [id, ts] of Object.entries(b.deleted || {})) out.deleted[id] = Math.max(out.deleted[id] || 0, ts);
  for (const c of COLLS) {
    const map = new Map();
    for (const r of [...(a[c] || []), ...(b[c] || [])]) {
      const cur = map.get(r.id);
      if (!cur || (r.updatedAt || 0) > (cur.updatedAt || 0)) map.set(r.id, r);
    }
    out[c] = [...map.values()].filter(r => !(out.deleted[r.id] >= (r.updatedAt || 0)));
  }
  const sa = a.settings || {}, sb = b.settings || {};
  out.settings = { ...DEFAULT_SETTINGS, ...((sb.updatedAt || 0) > (sa.updatedAt || 0) ? sb : sa) };
  return canon(out);
}
// Same data always serialises the same way, so we can tell if anything really changed.
function canon(d) {
  const out = { v: 1 };
  for (const c of COLLS) out[c] = [...(d[c] || [])].sort((x, y) => (x.id < y.id ? -1 : x.id > y.id ? 1 : 0));
  out.settings = { ...DEFAULT_SETTINGS, ...(d.settings || {}) };
  // forget deletion markers older than 120 days to keep the file small
  const cutoff = Date.now() - 120 * 864e5;
  out.deleted = Object.fromEntries(Object.entries(d.deleted || {}).filter(([, t]) => t > cutoff).sort());
  return out;
}

/* ---------- Sharing between phones: a data file in a private GitHub repo ----------
   Each save is a commit, so GitHub also keeps a full history (a free backup). */
const SYNC = { state: CFG.sync ? "idle" : "off", msg: "", last: 0, busy: false, again: false, timer: null };
const b64enc = s => { const bytes = new TextEncoder().encode(s); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));

async function ghFetch(path, opts = {}) {
  const { token } = CFG.sync;
  const res = await fetch("https://api.github.com" + path, {
    cache: "no-store", ...opts,
    headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) },
  });
  return res;
}
function ghError(res, j) {
  if (res.status === 401) return "GitHub didn't accept the access token. It may have expired — make a new one in Settings → Sharing.";
  if (res.status === 403) return "The access token isn't allowed to change this repository. Give it Contents: Read and write.";
  if (res.status === 404) return "Couldn't find that repository. Check the name, and that the token can see it.";
  return (j && j.message) || "GitHub error " + res.status;
}
const dataPath = () => `/repos/${encodeURIComponent(CFG.sync.owner)}/${encodeURIComponent(CFG.sync.repo)}/contents/${CFG.sync.path || "studio-data.json"}`;

async function pullRemote() {
  const res = await ghFetch(dataPath() + "?t=" + Date.now());
  if (res.status === 404) {
    const repo = await ghFetch(`/repos/${encodeURIComponent(CFG.sync.owner)}/${encodeURIComponent(CFG.sync.repo)}`);
    if (!repo.ok) throw new Error(ghError(repo));
    return null; // repo exists, data file not created yet
  }
  const j = await res.json().catch(() => null);
  if (!res.ok) throw new Error(ghError(res, j));
  let text;
  if (j.content && j.encoding === "base64") text = b64dec(j.content);
  else { // big file (over 1 MB): ask for the raw contents
    const raw = await ghFetch(dataPath() + "?t=" + Date.now(), { headers: { Accept: "application/vnd.github.raw+json" } });
    text = await raw.text();
  }
  return { sha: j.sha, data: JSON.parse(text) };
}
async function pushRemote(data, sha) {
  const res = await ghFetch(dataPath(), {
    method: "PUT",
    body: JSON.stringify({ message: `Update from ${ME()}'s ${/Mobi|Android|iPhone/i.test(navigator.userAgent) ? "phone" : "computer"}`, content: b64enc(JSON.stringify(data, null, 1)), ...(sha ? { sha } : {}) }),
  });
  if (res.status === 409 || res.status === 422) return false; // someone else saved first — merge again
  if (!res.ok) { const j = await res.json().catch(() => null); throw new Error(ghError(res, j)); }
  return true;
}
async function syncNow(quiet) {
  if (!CFG.sync) return;
  if (!navigator.onLine) { setSync("offline"); return; }
  if (SYNC.busy) { SYNC.again = true; return; }
  SYNC.busy = true; setSync("syncing");
  try {
    for (let attempt = 0; attempt < 5; attempt++) {
      const remote = await pullRemote();
      const merged = merge(S, remote && remote.data);
      const before = JSON.stringify(canon(S));
      S = merged; saveLocal();
      const same = remote && JSON.stringify(canon(remote.data)) === JSON.stringify(merged);
      if (JSON.stringify(merged) !== before) { render(); refreshDetail(); }
      if (same) break;
      if (await pushRemote(merged, remote && remote.sha)) break;
      await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
    }
    SYNC.last = Date.now(); setSync("ok");
    if (!quiet && SYNC.manual) { toast("All synced"); SYNC.manual = false; }
  } catch (e) {
    setSync("error", e.message || String(e));
  } finally {
    SYNC.busy = false;
    if (SYNC.again) { SYNC.again = false; syncNow(true); }
  }
}
function scheduleSync() { if (!CFG.sync) return; clearTimeout(SYNC.timer); setSync("pending"); SYNC.timer = setTimeout(() => syncNow(true), 1200); }
function setSync(state, msg = "") { SYNC.state = state; SYNC.msg = msg; const el = $("#syncBadge"); if (el) el.outerHTML = syncBadge(); }
function syncBadge() {
  const m = {
    off: ["var(--muted)", "This device only"], idle: ["var(--muted)", "Shared"], pending: ["var(--butter)", "Saving…"],
    syncing: ["var(--sky)", "Syncing…"], ok: ["var(--sage)", "Synced"], offline: ["var(--butter)", "Offline — will sync later"], error: ["var(--bad)", "Sync problem"],
  }[SYNC.state] || ["var(--muted)", ""];
  return `<button class="sync" id="syncBadge" data-act="sync-info" title="${esc(SYNC.msg)}"><span class="dot" style="background:${m[0]}"></span>${m[1]}</button>`;
}

const docTotal = d => {
  const sub = (d.items || []).reduce((a, it) => a + num(it.q || 1) * num(it.p), 0);
  const disc = num(d.discount);
  const vat = d.type === "invoice" || d.type === "quote" ? (sub - disc) * num(d.vat ?? 0) / 100 : 0;
  return { sub, disc, vat, total: sub - disc + vat };
};
const paidOn = d => S.payments.filter(p => p.docId === d.id).reduce((a, p) => a + num(p.amount), 0);
const balance = d => docTotal(d).total - paidOn(d);
function invStatus(d) {
  if (d.type === "quote") {
    if (d.status === "accepted" || d.status === "declined" || d.status === "invoiced") return d.status;
    if (d.status === "sent" && d.validUntil && d.validUntil < today()) return "expired";
    return d.status || "draft";
  }
  const t = docTotal(d).total, p = paidOn(d);
  if (t > 0 && p >= t - 0.005) return "paid";
  if (d.status === "draft" || !d.status) return p > 0 ? "part" : "draft";
  if (d.dueDate && d.dueDate < today()) return "overdue";
  return p > 0 ? "part" : "sent";
}
const STATUS_PILL = {
  draft: ["Draft", ""], sent: ["Sent", "p-sky"], paid: ["Paid", "p-sage"], part: ["Part paid", "p-butter"], overdue: ["Overdue", "p-bad"],
  accepted: ["Accepted", "p-sage"], declined: ["Declined", ""], expired: ["Expired", "p-butter"], invoiced: ["Invoiced", "p-lilac"],
};
const statusPill = d => { const [l, c] = STATUS_PILL[invStatus(d)] || ["", ""]; return `<span class="pill ${c}">${l}</span>`; };
const clientName = id => (get("clients", id) || {}).business || "No client";
function nextDocNumber(type) {
  const prefix = type === "quote" ? S.settings.quotePrefix : S.settings.invPrefix;
  let max = 0;
  for (const d of S.docs) if (d.type === type) { const m = String(d.number || "").match(/(\d+)\s*$/); if (m) max = Math.max(max, +m[1]); }
  return prefix + String(max + 1).padStart(4, "0");
}
function inPeriod(dateStr, period) {
  if (!dateStr) return false;
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const [dy, dm] = dateStr.split("-").map(Number);
  if (period === "month") return dy === y && dm - 1 === m;
  if (period === "last") { const lm = m === 0 ? 11 : m - 1, ly = m === 0 ? y - 1 : y; return dy === ly && dm - 1 === lm; }
  if (period === "year") return dy === y;
  return true;
}

function attentionItems() {

  for (const k of S.tasks) if (!k.done && k.date && k.date <= t)
    items.push({ act: "task", id: k.id, ic: "bell", c: k.date < t ? "bad" : "accent", title: k.title, sub: `${k.date < t ? "Overdue · " + niceDate(k.date) : "Today" + (k.time ? " " + k.time : "")}${k.who && k.who !== "Both" ? " · " + k.who : ""}`, sort: k.date + (k.time || "") });
  for (const l of S.leads) if (OPEN_STAGES.includes(l.stage) && l.followUp && l.followUp <= t)
    items.push({ act: "lead", id: l.id, ic: "leads", c: "lilac", title: `Follow up: ${l.business}`, sub: `${stageOf(l.stage).label} · ${niceDate(l.followUp)}`, sort: l.followUp });
  for (const d of S.docs) {
    const st = invStatus(d);
    if (d.type === "invoice" && st === "overdue") items.push({ act: "doc", id: d.id, ic: "doc", c: "bad", title: `${d.number} is overdue`, sub: `${clientName(d.clientId)} · ${money(balance(d))} owed`, sort: d.dueDate });

  }
  for (const c of S.clients) if (c.renewal && daysBetween(t, c.renewal) <= 30)

const COLL_LABEL = { clients: ["client", "client"], leads: ["lead", "lead"], jobs: ["job", "job"], tasks: ["reminder", "task"], docs: ["", "doc"], payments: ["payment", "payment"], expenses: ["expense", "expense"] };

    list = es.length ? es.map(expRow).join("") : `<div class="empty">No expenses ${periodName}.</div>`;
  }
  return `
    <div class="chips">${[["month", "This month"], ["last", "Last month"], ["year", "This year"], ["all", "All time"]].map(([k, l]) => `<button class="chip ${P === k ? "on" : ""}" data-act="period" data-id="${k}">${l}</button>`).join("")}</div>
    <div class="stats">
      <div class="card stat"><small>Money in</small><b style="color:var(--sage)">${moneyShort(inc)}</b><em>${periodName}</em></div>
      <div class="card stat"><small>Money out</small><b>${moneyShort(exp)}</b><em>${periodName}</em></div>
      <div class="card stat"><small>Profit</small><b style="color:${inc - exp < 0 ? "var(--bad)" : "var(--ink)"}">${moneyShort(inc - exp)}</b><em>${periodName}</em></div>
      <div class="card stat"><small>Still owed</small><b>${moneyShort(owed)}</b><em>${monthly ? moneyShort(monthly) + "/m from upkeep" : "unpaid invoices"}</em></div>
    </div>
    <div class="card pad section" style="margin-top:12px">
      <div class="section-h" style="margin:0 0 4px"><h2 style="font-size:16px">Last 6 months</h2></div>
      ${chartSVG()}
      <div class="legend"><span><i style="background:var(--sage)"></i>Money in</span><span><i style="background:var(--accent)"></i>Money out</span></div>
    </div>
    <div class="chips section" style="margin-top:18px">${[["invoices", "Invoices"], ["quotes", "Quotes"], ["payments", "Payments"], ["expenses", "Expenses"]].map(([k, l]) => `<button class="chip ${seg === k ? "on" : ""}" data-act="money-seg" data-id="${k}">${l}</button>`).join("")}</div>
    <div class="card list">${list}</div>`;
}
function chartSVG() {
  const now = new Date(), months = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push([d.getFullYear(), d.getMonth()]); }
  const sum = (arr, y, m) => arr.filter(r => { if (!r.date) return false; const [ry, rm] = r.date.split("-").map(Number); return ry === y && rm - 1 === m; }).reduce((a, r) => a + num(r.amount), 0);
  const data = months.map(([y, m]) => ({ l: MONTHS[m], i: sum(S.payments, y, m), o: sum(S.expenses, y, m) }));
  const max = Math.max(1, ...data.flatMap(d => [d.i, d.o]));
  const W = 600, H = 180, base = 150, top = 18, cw = W / 6, bw = Math.min(26, cw / 3.2);
  const bars = data.map((d, k) => {
    const x = k * cw + cw / 2, hi = (d.i / max) * (base - top), ho = (d.o / max) * (base - top);
    return `<rect x="${x - bw - 2}" y="${base - hi}" width="${bw}" height="${Math.max(hi, d.i ? 2 : 0)}" rx="4" fill="var(--sage)"><title>${d.l}: in ${money(d.i)}</title></rect>
      <rect x="${x + 2}" y="${base - ho}" width="${bw}" height="${Math.max(ho, d.o ? 2 : 0)}" rx="4" fill="var(--accent)" opacity=".85"><title>${d.l}: out ${money(d.o)}</title></rect>
      ${d.i ? `<text x="${x - bw / 2 - 2}" y="${base - hi - 5}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.i >= 1000 ? (d.i / 1000).toFixed(d.i >= 10000 ? 0 : 1) + "k" : Math.round(d.i)}</text>` : ""}
      <text x="${x}" y="${base + 20}" text-anchor="middle" font-size="12" fill="var(--muted)" font-weight="600">${d.l}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>${bars}</svg>`;
}
function docRow(d) {

/* ---------- Reminders ---------- */
function tasksView() {
  const f = UI.taskFilter, t = today();
  const mine = k => !k.who || k.who === "Both" || k.who === ME();
  let ts = S.tasks.filter(k => f === "done" ? k.done : !k.done).filter(k => f === "mine" ? mine(k) : true);
  const chips = `<div class="chips">${[["all", "Everyone"], ["mine", "Mine"], ["done", "Done"]].map(([k, l]) => `<button class="chip ${f === k ? "on" : ""}" data-act="task-filter" data-id="${k}">${l}</button>`).join("")}</div>`;
  if (!S.tasks.length) return chips + `<div class="card empty" style="padding:40px 20px">Reminders for follow-ups, calls, renewals — anything you don't want to forget. You can add each one to your phone's calendar too.<br><br><button class="btn primary" data-act="new-task">${icon("plus")}Add a reminder</button></div>`;
  if (f === "done") { ts.sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)); return chips + `<div class="card list">${ts.slice(0, 60).map(taskRow).join("") || `<div class="empty">Nothing done yet.</div>`}</div>`; }
  const sortT = (a, b) => ((a.date || "9") + (a.time || "")) < ((b.date || "9") + (b.time || "")) ? -1 : 1;
  const groups = [
    ["Overdue", ts.filter(k => k.date && k.date < t)],
    ["Today", ts.filter(k => k.date === t)],
    ["Tomorrow", ts.filter(k => k.date === addDays(t, 1))],
    ["Later", ts.filter(k => k.date && k.date > addDays(t, 1))],
    ["Some time", ts.filter(k => !k.date)],

   Pop-up sheets: details, forms, settings
   ===================================================================== */
const SHEETS = [];
let ignorePop = false;
function openSheet({ title, body, foot = "", onMount, key }) {
  const ov = document.createElement("div");
  ov.className = "overlay"; ov.dataset.key = key || "";
  if (NOANIM) ov.style.animation = "none";
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"${NOANIM ? ' style="animation:none"' : ""}><div class="sheet-h"><h2>${title}</h2><button class="icon-btn" data-close aria-label="Close">${icon("x")}</button></div>
    <div class="sheet-b">${body}</div>${foot ? `<div class="sheet-f">${foot}</div>` : ""}</div>`;
  document.body.appendChild(ov); SHEETS.push(ov);
  if (!(history.state && history.state.sheet)) history.pushState({ sheet: 1 }, "");
  ov.addEventListener("mousedown", e => { ov._down = e.target === ov; });
  ov.addEventListener("click", e => { if ((e.target === ov && ov._down) || e.target.closest("[data-close]")) closeSheet(); });
  document.body.style.overflow = "hidden";
  onMount && onMount(ov);
  return ov;
}
function closeSheet() {
  const ov = SHEETS.pop(); if (ov) ov.remove();
  if (!SHEETS.length) {
    document.body.style.overflow = "";
    setTimeout(() => { if (!SHEETS.length && history.state && history.state.sheet) { ignorePop = true; history.back(); } }, 60);
  }
}
function closeAll() { while (SHEETS.length) closeSheet(); }
window.addEventListener("popstate", () => {
  if (ignorePop) { ignorePop = false; return; }
  const ov = SHEETS.pop(); if (ov) ov.remove();
  if (SHEETS.length) history.pushState({ sheet: 1 }, ""); else document.body.style.overflow = "";
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && SHEETS.length) closeSheet(); });
// Re-open a detail sheet in place after an edit, so it shows fresh data.
let NOANIM = false;
function refreshTop(fn) {
  const ov = SHEETS.pop(); const sc = ov ? ov.querySelector(".sheet-b").scrollTop : 0;
  if (ov) ov.remove();
  NOANIM = true; try { fn(); } finally { NOANIM = false; }
  const top = SHEETS[SHEETS.length - 1];
  if (ov && top && top !== ov) top.querySelector(".sheet-b").scrollTop = sc;
  if (!SHEETS.length) { document.body.style.overflow = ""; setTimeout(() => { if (!SHEETS.length && history.state && history.state.sheet) { ignorePop = true; history.back(); } }, 60); }
}
// After any change, redraw the detail sheet on top so it shows fresh data
// (unless someone is halfway through typing in it).
function refreshDetail() {
  const top = SHEETS[SHEETS.length - 1]; if (!top || !top.dataset.key) return;
  const a = document.activeElement;
  if (a && top.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type !== "checkbox" && a.value) return;
  const [k, id] = top.dataset.key.split(":");
  const fn = { lead: leadDetail, client: clientDetail, job: jobDetail, doc: docDetail }[k];
  if (fn) refreshTop(() => fn(id));
}

function fieldHTML(f, v) {
  const id = "f_" + f.k, cls = `f${f.half ? " half" : ""}`;
  v = v ?? f.def ?? "";
  const lab = `<label for="${id}">${esc(f.label)}${f.req ? " *" : ""}</label>`;
  const hint = f.hint ? `<span class="hint">${f.hint}</span>` : "";
  if (f.type === "select") return `<div class="${cls}">${lab}<select id="${id}" name="${f.k}">${f.options.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(v) ? "selected" : ""}>${esc(ol)}</option>`; }).join("")}</select>${hint}</div>`;
  if (f.type === "textarea") return `<div class="${cls}">${lab}<textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph || "")}">${esc(v)}</textarea>${hint}</div>`;
  const type = f.type === "money" ? "text" : f.type || "text";
  const extra = f.type === "money" ? 'inputmode="decimal"' : f.type === "tel" ? 'inputmode="tel"' : "";
  return `<div class="${cls}">${lab}<input id="${id}" name="${f.k}" type="${type}" ${extra} value="${esc(f.type === "money" && v !== "" ? num(v) : v)}" placeholder="${esc(f.ph || "")}" ${f.req ? "required" : ""} autocomplete="off">${hint}</div>`;
}
function formSheet({ title, fields, rec = {}, onSave, onDelete, saveLabel = "Save", onMount }) {
  openSheet({
    title,
    body: `<form class="form" id="frm" novalidate>${fields.map(f => fieldHTML(f, rec[f.k])).join("")}</form>`,
    foot: `${onDelete ? `<button class="btn danger" data-del style="flex:0 0 auto">${icon("trash")}</button>` : ""}<button class="btn" data-close>Cancel</button><button class="btn primary" data-save>${saveLabel}</button>`,
    onMount: ov => {
      const save = () => {
        const out = { ...rec };
        for (const f of fields) {
          const el = ov.querySelector(`[name="${f.k}"]`); if (!el) continue;
          out[f.k] = f.type === "money" ? (el.value.trim() === "" ? "" : num(el.value)) : el.value.trim();
        }
        const missing = fields.find(f => f.req && !String(out[f.k] ?? "").trim());
        if (missing) { toast(`Please fill in ${missing.label.toLowerCase()}`); ov.querySelector(`[name="${missing.k}"]`).focus(); return; }
        closeSheet(); onSave(out);
      };
      ov.querySelector("[data-save]").onclick = save;
      ov.querySelector("#frm").onsubmit = e => { e.preventDefault(); save(); };
      if (onDelete) ov.querySelector("[data-del]").onclick = () => { if (confirm("Delete this? It will be removed for both of you.")) { closeSheet(); onDelete(); } };
      onMount && onMount(ov);
      const first = ov.querySelector("input,select,textarea");
      if (first && !rec.id && matchMedia("(min-width:700px)").matches) first.focus();
    },
  });
}

/* ---------- Quotes & invoices ---------- */
function newDoc(type, preset = {}) {
  const t = today();
  return {
    type, number: nextDocNumber(type), date: t, status: "draft", vat: S.settings.vat,
    ...(type === "invoice" ? { dueDate: addDays(t, num(S.settings.terms) || 7) } : { validUntil: addDays(t, num(S.settings.quoteValid) || 14) }),
    items: [{ d: "", q: 1, p: "" }], notes: "", ...preset,
  };
}
function editDoc(rec) {

function icsFor(t) {
  if (!t.date) { toast("Give it a day first"); return; }
  const d = t.date.replace(/-/g, ""), stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const escI = s => String(s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/[,;]/g, m => "\\" + m);
  let start, end;
  if (t.time) { const tm = t.time.replace(":", "") + "00"; start = `DTSTART:${d}T${tm}`; const e = new Date(`${t.date}T${t.time}:00`); e.setMinutes(e.getMinutes() + 30); end = `DTEND:${ymd(e).replace(/-/g, "")}T${String(e.getHours()).padStart(2, "0")}${String(e.getMinutes()).padStart(2, "0")}00`; }
  else { start = `DTSTART;VALUE=DATE:${d}`; end = `DTEND;VALUE=DATE:${addDays(t.date, 1).replace(/-/g, "")}`; }
  const link = t.linkId && (get("clients", t.linkId) || get("leads", t.linkId));
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Studio//EN", "BEGIN:VEVENT", `UID:${t.id}@studio`, `DTSTAMP:${stamp}`, start, end,
    `SUMMARY:${escI(t.title)}`, `DESCRIPTION:${escI([link ? link.business : "", t.notes].filter(Boolean).join("\n"))}`,
    "BEGIN:VALARM", t.time ? "TRIGGER:-PT15M" : "TRIGGER:PT8H", "ACTION:DISPLAY", `DESCRIPTION:${escI(t.title)}`, "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  download(`reminder-${t.date}.ics`, ics, "text/calendar");
}

          ${fieldHTML({ k: "s_token", label: "Access token", type: "password", ph: "github_pat_…" }, "")}
        </div>
        <button class="btn primary" style="width:100%;margin-top:12px" data-act="connect">${icon("sync")}Connect</button>`}
      </div>

      <div class="section-h section"><h2 style="font-size:17px">On your quotes & invoices</h2></div>
      <div class="card pad"><form class="form" id="setForm">
        ${fieldHTML({ k: "bizName", label: "Business name", half: true }, st.bizName)}
        ${fieldHTML({ k: "bizTagline", label: "Line under the name", half: true }, st.bizTagline)}
        ${fieldHTML({ k: "bizPhone", label: "Phone", type: "tel", half: true }, st.bizPhone)}
        ${fieldHTML({ k: "bizEmail", label: "Email", type: "email", half: true }, st.bizEmail)}
        ${fieldHTML({ k: "bizAddress", label: "Address (optional)", type: "textarea" }, st.bizAddress)}
        ${fieldHTML({ k: "bank", label: "Banking details", type: "textarea", ph: "Bank: …\nAccount name: …\nAccount number: …\nBranch code: …" }, st.bank)}
        ${fieldHTML({ k: "invPrefix", label: "Invoice number starts with", half: true }, st.invPrefix)}
        ${fieldHTML({ k: "quotePrefix", label: "Quote number starts with", half: true }, st.quotePrefix)}
        ${fieldHTML({ k: "terms", label: "Days to pay an invoice", type: "money", half: true }, st.terms)}
        ${fieldHTML({ k: "quoteValid", label: "Days a quote is valid", type: "money", half: true }, st.quoteValid)}
        ${fieldHTML({ k: "vat", label: "Default VAT %", type: "money", half: true }, st.vat)}
        ${fieldHTML({ k: "footer", label: "Thank-you line", half: true }, st.footer)}
        ${fieldHTML({ k: "people", label: "Your two names (comma between)", half: true }, st.people.join(", "))}
        ${fieldHTML({ k: "checklist", label: "Steps for every new job (one per line)", type: "textarea" }, st.checklist.join("\n"))}
      </form><button class="btn primary" style="width:100%;margin-top:12px" data-act="save-settings">Save details</button></div>

      <div class="section-h section"><h2 style="font-size:17px">Backup</h2></div>
      <div class="card pad"><p class="small muted" style="margin-top:0">Download everything as one file, or load a backup file back in.</p>
        <div class="actions" style="margin:0"><button class="btn sm" data-act="export">${icon("out")}Download backup</button><label class="btn sm">${icon("doc")}Restore backup<input type="file" accept="application/json,.json" id="importFile" hidden></label><button class="btn sm" data-act="export-csv">${icon("doc")}Income & expenses (CSV)</button></div>
      </div>
      <p class="small muted" style="text-align:center;margin:20px 0 4px">Studio · made for ${esc(st.people.join(" & "))}</p>`,
    onMount: ov => {
      ov.querySelector("#importFile").onchange = async e => {
        const f = e.target.files[0]; if (!f) return;
        try {
          const d = JSON.parse(await f.text());
          if (!d || !d.v || !Array.isArray(d.clients)) throw new Error("not a Studio backup");
          if (!confirm("Merge this backup into your data? Nothing you have now will be lost — newer edits win.")) return;
          S = merge(S, d); commit(); toast("Backup loaded"); refreshTop(settingsSheet);
        } catch (err) { toast("Couldn't read that file: " + err.message); }
      };
    },
  });
}

/* =====================================================================
   Actions (one click handler for the whole app)
   ===================================================================== */
const ACT = {
  "tab": id => { VIEW = id; UI.q = ""; render(); window.scrollTo(0, 0); },
  "goto-money": id => { VIEW = "money"; UI.moneySeg = id; UI.period = "all"; render(); window.scrollTo(0, 0); },
  "goto-jobs": () => { VIEW = "clients"; UI.clientSeg = "jobs"; render(); window.scrollTo(0, 0); },
  "lead-stage": id => { UI.leadStage = id; render(); },
  "client-seg": id => { UI.clientSeg = id; render(); },
  "money-seg": id => { UI.moneySeg = id; render(); },
  "period": id => { UI.period = id; render(); },
  "task-filter": id => { UI.taskFilter = id; render(); },
  "settings": () => settingsSheet(),
  "sync-info": () => { if (!CFG.sync) settingsSheet(); else if (SYNC.state === "error") { toast(SYNC.msg); } else { SYNC.manual = true; syncNow(); } },
  "fab": () => {
    if (VIEW === "leads") return editLead();
    if (VIEW === "clients") return UI.clientSeg === "jobs" ? editJob() : editClient();
    if (VIEW === "tasks") return editTask();
    if (VIEW === "money") return ({ invoices: () => editDoc(newDoc("invoice")), quotes: () => editDoc(newDoc("quote")), payments: () => editPayment(), expenses: () => editExpense() })[UI.moneySeg]();
    openSheet({
      title: "Add", body: `<div class="card list">${[["new-lead", "leads", "Lead", "A business you could sell to", "lilac"], ["new-client", "clients", "Client", "Someone you're working with", "sage"], ["new-job", "job", "Job", "A website you're building", "sky"], ["new-task", "bell", "Reminder", "Don't forget to…", "accent"], ["new-quote", "doc", "Quote", "Send a price", "butter"], ["new-invoice", "doc", "Invoice", "Get paid", "sky"], ["new-payment", "cash", "Money in", "A client paid you", "sage"], ["new-expense", "out", "Money out", "Something you paid for", "accent"]]
        .map(([a, ic, t, s, c]) => `<button class="row" data-act="${a}" data-sub="1"><span class="av p-${c}">${icon(ic, 'style="width:18px;height:18px"')}</span><span class="grow"><span class="t" style="display:block">${t}</span><span class="s" style="display:block">${s}</span></span></button>`).join("")}</div>`,
    });
  },
  "new-lead": () => editLead(), "new-client": () => editClient(), "new-job": () => editJob(), "new-task": () => editTask(),
  "new-quote": () => editDoc(newDoc("quote")), "new-invoice": () => editDoc(newDoc("invoice")), "new-payment": () => editPayment(), "new-expense": () => editExpense(),
  "lead": id => leadDetail(id), "client": id => clientDetail(id), "job": id => jobDetail(id), "doc": id => docDetail(id),
  "task": id => editTask({ ...get("tasks", id) }), "payment": id => editPayment({ ...get("payments", id) }), "expense": id => editExpense({ ...get("expenses", id) }),
  "edit-lead": id => editLead({ ...get("leads", id) }, r => refreshIfOpen("lead:" + r.id, () => leadDetail(r.id))),
  "edit-client": id => editClient({ ...get("clients", id) }), "edit-job": id => editJob({ ...get("jobs", id) }), "edit-doc": id => editDoc(JSON.parse(JSON.stringify(get("docs", id)))),
  "lead-move": (id, el) => { const l = get("leads", id); upsert("leads", { ...l, stage: el.dataset.stage, log: [...(l.log || []), { ts: Date.now(), by: ME(), text: `Moved to “${stageOf(el.dataset.stage).label}”` }] }); refreshTop(() => leadDetail(id)); if (el.dataset.stage === "won" && !l.clientId) toast("Nice! Tap “make them a client” when ready"); },
  "convert-lead": id => convertLead(id),
  "job-move": (id, el) => { const j = get("jobs", id); upsert("jobs", { ...j, status: el.dataset.stage }); refreshTop(() => jobDetail(id)); if (el.dataset.stage === "live") toast("Site is live 🎉 Don't forget the final invoice"); },
  "job-check": (id, el) => { const j = get("jobs", id), ck = (j.checklist || []).map(x => ({ ...x })); ck[+el.dataset.i].done = el.checked; upsert("jobs", { ...j, checklist: ck }); refreshTop(() => jobDetail(id)); },
  "job-uncheck-del": (id, el) => { const j = get("jobs", id), ck = (j.checklist || []).filter((_, i) => i !== +el.dataset.i); upsert("jobs", { ...j, checklist: ck }); refreshTop(() => jobDetail(id)); },
  "job-add-step": id => { const v = $("#newStep").value.trim(); if (!v) return; const j = get("jobs", id); upsert("jobs", { ...j, checklist: [...(j.checklist || []), { t: v, done: false }] }); refreshTop(() => jobDetail(id)); },
  "add-note": (id, el) => {
    const v = $("#newNote").value.trim(); if (!v) return;
    const coll = el.dataset.coll, r = get(coll, id);
    upsert(coll, { ...r, log: [...(r.log || []), { ts: Date.now(), by: ME(), text: v }] });
    refreshTop(() => ({ leads: leadDetail, clients: clientDetail, jobs: jobDetail })[coll](id));
  },
  "new-task-for": id => editTask({ linkId: id, date: addDays(today(), 1) }),
  "new-job-for": id => editJob({ clientId: id }),
  "new-quote-for": id => editDoc(newDoc("quote", { clientId: id })),
  "new-invoice-for": id => editDoc(newDoc("invoice", { clientId: id })),
  "new-payment-for": id => editPayment({ clientId: id }),
  "quote-for-lead": id => { const l = get("leads", id); editDoc(newDoc("quote", l.clientId ? { clientId: l.clientId } : { leadId: id, items: [{ d: "Website design", q: 1, p: num(l.value) || "" }] })); },
  "quote-for-job": id => { const j = get("jobs", id); editDoc(newDoc("quote", { clientId: j.clientId, jobId: id, items: [{ d: j.title, q: 1, p: num(j.price) || "" }] })); },
  "invoice-for-job": id => {
    const j = get("jobs", id), q = S.docs.find(d => d.jobId === id && d.type === "quote" && d.status === "accepted");
    editDoc(newDoc("invoice", { clientId: j.clientId, jobId: id, items: q ? q.items.map(x => ({ ...x })) : [{ d: j.title, q: 1, p: num(j.price) || "" }] }));
  },
  "doc-sent": id => { const d = get("docs", id); upsert("docs", { ...d, status: "sent", sentOn: today() }); refreshTop(() => docDetail(id)); toast("Marked as sent"); },
  "pay-doc": id => { const d = get("docs", id); editPayment({ docId: id, clientId: d.clientId }); },
  "quote-accept": id => {
    const d = get("docs", id); upsert("docs", { ...d, status: "accepted" });
    if (d.leadId) { const l = get("leads", d.leadId); if (l && !l.clientId) { refreshTop(() => docDetail(id)); if (confirm(`${l.business} accepted! Make them a client now?`)) convertLead(l.id); return; } }
    refreshTop(() => docDetail(id)); toast("Quote accepted 🎉");
  },
  "quote-decline": id => { const d = get("docs", id); upsert("docs", { ...d, status: "declined" }); refreshTop(() => docDetail(id)); },
  "quote-to-inv": id => {
    const q = get("docs", id);
    if (!q.clientId) { toast("Make the lead a client first"); return; }
    const inv = newDoc("invoice", { clientId: q.clientId, jobId: q.jobId, items: q.items.map(x => ({ ...x })), discount: q.discount, vat: q.vat, fromQuote: q.id });
    upsert("docs", { ...q, status: "invoiced" });
    upsert("docs", inv); closeSheet(); docDetail(inv.id); toast(`Invoice ${inv.number} created`);
  },
  "doc-print": id => printDoc(get("docs", id)),
  "doc-wa": id => { const d = get("docs", id), c = get("clients", d.clientId) || (d.leadId && get("leads", d.leadId)) || {}; window.open(c.phone ? waLink(c.phone, docMessage(d)) : "https://wa.me/?text=" + encodeURIComponent(docMessage(d)), "_blank"); if (d.status === "draft") upsert("docs", { ...d, status: "sent", sentOn: today() }); },
  "doc-mail": id => { const d = get("docs", id), c = get("clients", d.clientId) || {}; location.href = `mailto:${encodeURIComponent(c.email || "")}?subject=${encodeURIComponent(`${d.type === "quote" ? "Quote" : "Invoice"} ${d.number} from ${S.settings.bizName}`)}&body=${encodeURIComponent(docMessage(d) + "\n\n(PDF attached)")}`; },
  "doc-dup": id => { const d = JSON.parse(JSON.stringify(get("docs", id))); for (const k of ["id", "createdAt", "updatedAt", "by", "sentOn", "fromQuote"]) delete d[k]; closeSheet(); editDoc({ ...newDoc(d.type), clientId: d.clientId, jobId: d.jobId, items: d.items, discount: d.discount, vat: d.vat, notes: d.notes }); },
  "toggle-task": (id, el) => { const t = get("tasks", id); upsert("tasks", { ...t, done: el.checked, doneAt: el.checked ? Date.now() : null }); if (el.checked) toast("Done ✓"); const top = SHEETS[SHEETS.length - 1]; if (top && top.dataset.key) { const [k, kid] = top.dataset.key.split(":"); refreshTop(() => ({ lead: leadDetail, client: clientDetail })[k]?.(kid)); } },
  "pick-me": id => { CFG.me = id; saveCfg(); if (SHEETS.length) refreshTop(settingsSheet); render(); syncNow(true); },
  "theme": id => { CFG.theme = id; saveCfg(); applyTheme(); refreshTop(settingsSheet); },
  "save-settings": () => {
    const f = $("#setForm"), v = k => f.querySelector(`[name="${k}"]`).value;
    const people = v("people").split(",").map(s => s.trim()).filter(Boolean).slice(0, 2);
    const oldMe = ME();
    saveSettings({ bizName: v("bizName").trim(), bizTagline: v("bizTagline").trim(), bizPhone: v("bizPhone").trim(), bizEmail: v("bizEmail").trim(), bizAddress: v("bizAddress").trim(), bank: v("bank").trim(),
      invPrefix: v("invPrefix"), quotePrefix: v("quotePrefix"), terms: num(v("terms")) || 7, quoteValid: num(v("quoteValid")) || 14, vat: num(v("vat")), footer: v("footer").trim(),
      people: people.length === 2 ? people : S.settings.people, checklist: v("checklist").split("\n").map(s => s.trim()).filter(Boolean) });
    if (!S.settings.people.includes(oldMe)) { CFG.me = S.settings.people[0]; saveCfg(); }
    toast("Details saved"); refreshTop(settingsSheet);
  },
  "connect": async () => {
    const owner = $('[name="s_owner"]').value.trim(), repo = $('[name="s_repo"]').value.trim(), token = $('[name="s_token"]').value.trim();
    if (!owner || !repo || !token) { toast("Fill in all three boxes"); return; }
    CFG.sync = { owner, repo, token, path: "studio-data.json" }; saveCfg();
    toast("Connecting…"); await syncNow(true);
    if (SYNC.state === "error") { const m = SYNC.msg; delete CFG.sync; saveCfg(); setSync("off"); toast(m); return; }
    toast("Connected! Now send the invite link"); refreshTop(settingsSheet); render();
  },
  "sync-now": () => { SYNC.manual = true; syncNow().then(() => { if (SHEETS.length) refreshTop(settingsSheet); }); },
  "invite": async () => {
    const code = b64enc(JSON.stringify({ o: CFG.sync.owner, r: CFG.sync.repo, t: CFG.sync.token }));
    const link = location.origin + location.pathname + "#join=" + code;
    const text = `Open this on your phone to join our Studio app:\n${link}`;
    if (navigator.share) { try { await navigator.share({ title: "Studio invite", text }); return; } catch {} }
    try { await navigator.clipboard.writeText(link); toast("Invite link copied — send it privately"); } catch { prompt("Copy this invite link:", link); }
  },
  "unlink": () => { if (!confirm("Stop sharing on this device? Your data stays here, it just won't sync any more.")) return; delete CFG.sync; saveCfg(); setSync("off"); refreshTop(settingsSheet); render(); },
  "export": () => download(`studio-backup-${today()}.json`, JSON.stringify(canon(S), null, 1)),
  "export-csv": () => {
    const rows = [["Date", "Type", "Description", "Client", "Category / method", "Amount"]];
    for (const p of S.payments) rows.push([p.date, "Money in", p.note || (get("docs", p.docId) || {}).number || "", p.clientId ? clientName(p.clientId) : "", p.method || "", num(p.amount).toFixed(2)]);
    for (const e of S.expenses) rows.push([e.date, "Money out", e.desc, e.clientId ? clientName(e.clientId) : "", e.cat || "", (-num(e.amount)).toFixed(2)]);
    rows.splice(1, rows.length, ...rows.slice(1).sort((a, b) => (a[0] < b[0] ? -1 : 1)));
    download(`studio-money-${today()}.csv`, rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n"), "text/csv");
  },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, fn = ACT[act]; if (!fn) return;
  if (el.tagName === "INPUT" && el.type === "checkbox") e.stopPropagation();
  else e.preventDefault();
  // from the "Add" menu: close it first, then open the form
  if (el.dataset.sub) closeSheet();
  // don't trigger the row underneath when ticking a checkbox inside it
  if (act === "task" && e.target.closest('input[type="checkbox"]')) return;
  fn(el.dataset.id, el);
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { UI.q = e.target.value; $("#qres").innerHTML = searchResults(); }
});

/* ---------- Start ---------- */
(function start() {
  const m = location.hash.match(/#join=([^&]+)/);
  if (m) {
    try {
      const j = JSON.parse(b64dec(decodeURIComponent(m[1])));
      CFG.sync = { owner: j.o, repo: j.r, token: j.t, path: "studio-data.json" }; saveCfg();
      SYNC.state = "idle";
    } catch { alert("That invite link looks broken. Ask for a new one."); }
    history.replaceState(null, "", location.pathname);
  }
  applyTheme(); render();
  if (CFG.sync) syncNow(true);
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
